name: Daily League Leaders

on:
  push:
    branches:
      - main
  schedule:
    # 12:05 UTC every Monday, October through June only.
    # July-September is the NBA offseason, so the schedule never fires then.
    - cron: '5 12 * 10-12,1-6 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if outside the NBA season window'
        type: boolean
        default: false

jobs:
  # Cheap gate on a Linux runner: pushes to main and the edges of the cron
  # window can still land outside the season, so decide up front whether there
  # is any data worth fetching. Skipping a job is a success, not a failure.
  season_check:
    runs-on: ubuntu-latest
    outputs:
      in_season: ${{ steps.check.outputs.in_season }}
    steps:
      - name: Check if in NBA season
        id: check
        run: |
          # Season window as MMDD, wrapping across the new year: 1 October
          # through 30 June, i.e. preseason tip-off through the Finals.
          season_start=1001
          season_end=0630
          today=$(date -u +%m%d)

          # 10# forces base 10; MMDD values such as 0901 are not valid octal.
          if [[ "${{ inputs.force }}" == "true" ]]; then
            in_season=true
            echo "Forced run requested, ignoring the season window."
          elif (( 10#$today >= 10#$season_start || 10#$today <= 10#$season_end )); then
            in_season=true
          else
            in_season=false
          fi

          echo "in_season=$in_season" >> "$GITHUB_OUTPUT"
          if [[ $in_season == true ]]; then
            echo "In season ($today): running the data update." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NBA offseason ($today): skipping the data update." >> "$GITHUB_STEP_SUMMARY"
          fi

  nba_data_job:
    needs: season_check
    if: needs.season_check.outputs.in_season == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute League Leaders script
        timeout-minutes: 10
        run: |
          python leagueleaders.py

      - name: Commit files to nba-data repo
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Data update (`date +'%Y-%m-%d'`)"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Checkout nba-site repo
        uses: actions/checkout@v3
        with:
          repository: penborter/nba-site
          token: ${{ secrets.PAT }}
          path: nba_site

      - name: Copy files to nba-site repo
        run: |
          cp plot.png nba_site/assets/posts/moreyball/
          cp moreyball_full.yml nba_site/_data/
          cp distance.yml nba_site/_data/
          cp shot_distance.yml nba_site/_data/
          cp jerseys.yml nba_site/_data

      - name: Commit and push files to nba-site repo
        run: |
          cd nba_site
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/posts/moreyball/plot.png _data/moreyball_full.yml _data/distance.yml _data/shot_distance.yml _data/jerseys.yml
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated data update (`date +'%Y-%m-%d'`)"
            git push
          else
            echo "No changes to commit."
          fi
